<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product部門方針 — スライドショー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; color: #fff; font-family: "Hiragino Sans", sans-serif; }
    .deck { height: 100%; display: flex; flex-direction: column; }
    .slide {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px 24px 64px;
      overflow: hidden;
    }
    .slide.active { display: flex; }
    .slide iframe {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      border: none;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      font-size: 14px;
    }
    .bar button {
      background: #2f6fed;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .bar button:disabled { opacity: .4; cursor: default; }
    .hint { opacity: .7; font-size: 12px; }
    .edit-hint {
      position: fixed;
      right: 20px;
      bottom: 52px;
      opacity: .55;
      font-size: 11px;
      text-align: right;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="deck">
    <section class="slide active" data-index="0">
      <iframe src="Product部門方針-overview.html" title="Product部門方針 1/2"></iframe>
    </section>
    <section class="slide" data-index="1">
      <iframe src="Product部門方針-mission-mapping.html" title="ミッションと担当 2/2"></iframe>
    </section>
  </div>
  <div class="bar">
    <button id="prev" disabled>← 前へ</button>
    <span id="label">1 / 2 — 部門方針・体制</span>
    <button id="next">次へ →</button>
  </div>
  <p class="edit-hint">
    文章は各 HTML を直接編集（または PowerPoint を編集）<br />
    ← → キーでも操作
  </p>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const labels = ['1 / 2 — 部門方針・体制', '2 / 2 — ミッションと担当'];
    let i = 0;
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const label = document.getElementById('label');
    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
      label.textContent = labels[i];
      prev.disabled = i === 0;
      next.disabled = i === slides.length - 1;
    }
    prev.onclick = () => show(i - 1);
    next.onclick = () => show(i + 1);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });
  </script>
</body>
</html>
